<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Forward distribution change over diffusion time</title>
  <desc id="desc">Four distribution plots showing q(x0) becoming progressively smoother and closer to a standard normal distribution as noise is added.</desc>
  <defs><style>.title{font:600 29px Arial,sans-serif;fill:#111827}.h{font:600 18px Arial,sans-serif;fill:#111827}.t{font:400 15px Arial,sans-serif;fill:#374151}.small{font:400 13px Arial,sans-serif;fill:#4b5563}.formula{font:400 17px "Times New Roman",serif;fill:#111827}.axis{stroke:#6b7280;stroke-width:2}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.c1{fill:none;stroke:#ea580c;stroke-width:4}.c2{fill:none;stroke:#2563eb;stroke-width:4}.c3{fill:none;stroke:#16a34a;stroke-width:4}.c4{fill:none;stroke:#7c3aed;stroke-width:4}.fade{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 6}</style></defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="50" y="56" class="title">정방향 q: 노이즈를 더할수록 데이터 분포가 표준정규분포 쪽으로 붕괴한다</text>
  <text x="50" y="92" class="formula">q(xₜ | x₀) = N(√ᾱₜ x₀, (1-ᾱₜ)I),    xₜ = √ᾱₜx₀ + √(1-ᾱₜ)ε</text>
  <g transform="translate(45,140)"><rect class="frame" width="250" height="250"/><text x="20" y="30" class="h">t = 0</text><text x="20" y="55" class="formula">q(x₀)</text><line x1="35" y1="210" x2="220" y2="210" class="axis"/><line x1="35" y1="210" x2="35" y2="80" class="axis"/><path d="M40 207 C65 205,68 102,105 95 C135 92,145 198,165 198 C188 198,193 118,220 104" class="c1"/><text x="40" y="235" class="small">두 데이터 군집이 선명함</text></g>
  <g transform="translate(335,140)"><rect class="frame" width="250" height="250"/><text x="20" y="30" class="h">t = 작음</text><text x="20" y="55" class="formula">√ᾱₜ가 큼</text><line x1="35" y1="210" x2="220" y2="210" class="axis"/><line x1="35" y1="210" x2="35" y2="80" class="axis"/><path d="M40 206 C65 200,75 118,112 111 C142 109,152 185,172 187 C195 190,198 132,220 122" class="c2"/><path d="M43 206 C80 202,95 158,130 155 C162 153,183 183,220 202" class="fade"/><text x="40" y="235" class="small">원본 구조가 아직 보임</text></g>
  <g transform="translate(625,140)"><rect class="frame" width="250" height="250"/><text x="20" y="30" class="h">t = 중간</text><text x="20" y="55" class="formula">신호와 노이즈가 섞임</text><line x1="35" y1="210" x2="220" y2="210" class="axis"/><line x1="35" y1="210" x2="35" y2="80" class="axis"/><path d="M40 207 C70 195,84 143,120 135 C157 127,184 170,220 198" class="c3"/><path d="M52 206 C86 202,100 168,130 160 C164 163,186 190,218 204" class="fade"/><text x="40" y="235" class="small">군집 정보가 흐려짐</text></g>
  <g transform="translate(915,140)"><rect class="frame" width="250" height="250"/><text x="20" y="30" class="h">t = T</text><text x="20" y="55" class="formula">q_T(x_T) ≈ N(0,I)</text><line x1="35" y1="210" x2="220" y2="210" class="axis"/><line x1="35" y1="210" x2="35" y2="80" class="axis"/><path d="M43 207 C78 199,93 117,128 100 C163 117,178 199,218 207" class="c4"/><text x="40" y="235" class="small">원본 군집 구분이 거의 사라짐</text></g>
  <g transform="translate(70,465)"><rect width="1060" height="170" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="38" class="h">그림을 수식으로 읽는 법</text><text x="25" y="72" class="t">각 패널은 모든 원본 x₀를 합친 주변분포 qₜ(xₜ)를 개념적으로 그린 것이다.</text><text x="25" y="105" class="formula">qₜ(xₜ) = ∫ q(xₜ | x₀) q(x₀) dx₀</text><text x="25" y="138" class="t">t가 커지면 평균항 √ᾱₜx₀는 작아지고, 분산항 (1-ᾱₜ)I는 커져 원본 모양이 사라진다.</text></g>
</svg>
