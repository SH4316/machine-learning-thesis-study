<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Reverse sampling chain</title>
  <desc id="desc">A reverse diffusion chain from xT to x0 showing distributions at each step and sampled points moving toward data manifold.</desc>
  <defs><style>.title{font:600 29px Arial,sans-serif;fill:#111827}.h{font:600 18px Arial,sans-serif;fill:#111827}.t{font:400 15px Arial,sans-serif;fill:#374151}.small{font:400 13px Arial,sans-serif;fill:#4b5563}.formula{font:400 19px "Times New Roman",serif;fill:#111827}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.axis{stroke:#6b7280;stroke-width:2}.curve{fill:none;stroke:#2563eb;stroke-width:4}.wide{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:7 7}.dot{fill:#ea580c;stroke:#fff;stroke-width:3}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.data{stroke:#16a34a;stroke-width:4;fill:none}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="55" y="58" class="title">역방향 연쇄 샘플링: pθ(x₀)는 이 전체 절차가 유도하는 최종 분포다</text>
  <g transform="translate(60,135)"><rect class="frame" width="190" height="230"/><text x="22" y="32" class="h">x_T</text><text x="22" y="58" class="formula">N(0,I)</text><line x1="32" y1="185" x2="160" y2="185" class="axis"/><path d="M35 182 C60 178,72 95,96 75 C122 95,133 178,158 182" class="wide"/><circle cx="112" cy="120" r="8" class="dot"/><text x="22" y="212" class="small">순수 노이즈 표본</text></g>
  <g transform="translate(320,135)"><rect class="frame" width="190" height="230"/><text x="22" y="32" class="h">x_{T-1}</text><text x="22" y="58" class="formula">pθ(x_{T-1}|x_T)</text><line x1="32" y1="185" x2="160" y2="185" class="axis"/><path d="M34 183 C58 177,72 105,105 88 C135 105,145 177,160 183" class="curve"/><circle cx="122" cy="126" r="8" class="dot"/><text x="22" y="212" class="small">조금 구조화됨</text></g>
  <g transform="translate(580,135)"><rect class="frame" width="190" height="230"/><text x="22" y="32" class="h">x_t</text><text x="22" y="58" class="formula">pθ(x_{t-1}|x_t)</text><line x1="32" y1="185" x2="160" y2="185" class="axis"/><path d="M34 183 C60 176,69 120,94 103 C124 86,147 150,160 180" class="curve"/><circle cx="92" cy="118" r="8" class="dot"/><text x="22" y="212" class="small">형태가 구체화됨</text></g>
  <g transform="translate(840,135)"><rect class="frame" width="190" height="230"/><text x="22" y="32" class="h">x₁</text><text x="22" y="58" class="formula">pθ(x₀|x₁)</text><line x1="32" y1="185" x2="160" y2="185" class="axis"/><path d="M34 183 C60 180,72 147,96 120 C118 92,142 145,160 183" class="curve"/><circle cx="98" cy="121" r="8" class="dot"/><text x="22" y="212" class="small">마지막 디노이즈</text></g>
  <g transform="translate(1000,455)"><line x1="-855" y1="45" x2="70" y2="45" class="axis"/><path d="M-850 42 C-770 39,-755 -30,-700 -30 C-650 -30,-628 42,-590 42 C-530 42,-510 -45,-450 -50 C-382 -55,-360 40,-320 42 C-240 44,-220 -15,-170 -20 C-115 -24,-85 35,-55 42" class="data"/><circle cx="-168" cy="-20" r="9" class="dot"/><text x="-850" y="82" class="small">최종 x̂₀는 pθ(x₀)에서 나온 표본 하나</text></g>
  <path d="M255 250 C280 250,292 250,315 250" class="arrow"/><path d="M515 250 C540 250,552 250,575 250" class="arrow"/><path d="M775 250 C800 250,812 250,835 250" class="arrow"/><path d="M935 365 C900 440,845 495,790 500" class="arrow"/>
  <g transform="translate(95,620)"><rect width="1010" height="95" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="38" class="formula">pθ(x₀:T) = p(x_T) Πₜ pθ(xₜ₋₁ | xₜ)</text><text x="25" y="70" class="t">한 번의 생성은 위 곱분포에서 경로 하나를 뽑는 것이다. 경로의 마지막 점이 생성 이미지 x̂₀다.</text></g>
</svg>
