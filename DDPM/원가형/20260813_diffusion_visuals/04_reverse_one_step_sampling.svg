<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One reverse denoising sampling step</title>
  <desc id="desc">A visualization of p theta x t minus one conditioned on x t as a Gaussian distribution with learned mean and variance.</desc>
  <defs><style>.title{font:600 29px Arial,sans-serif;fill:#111827}.h{font:600 20px Arial,sans-serif;fill:#111827}.t{font:400 16px Arial,sans-serif;fill:#374151}.small{font:400 13px Arial,sans-serif;fill:#4b5563}.formula{font:400 20px "Times New Roman",serif;fill:#111827}.axis{stroke:#6b7280;stroke-width:2}.curve{fill:none;stroke:#2563eb;stroke-width:5}.mean{stroke:#16a34a;stroke-width:4}.sample{fill:#ea580c;stroke:#fff;stroke-width:3}.xt{fill:#7c3aed;stroke:#fff;stroke-width:3}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="55" y="58" class="title">역방향 한 단계: 모델은 “정답 한 점”이 아니라 조건부 분포를 만든다</text>
  <rect x="70" y="120" width="1060" height="390" class="frame"/><line x1="130" y1="430" x2="1070" y2="430" class="axis"/><line x1="130" y1="430" x2="130" y2="180" class="axis"/><text x="985" y="462" class="small">xₜ₋₁ 공간</text><text x="104" y="195" class="small">확률밀도</text><path d="M220 428 C320 425,410 335,520 230 C605 145,705 150,790 230 C900 335,980 425,1060 428" class="curve"/><line x1="650" y1="430" x2="650" y2="152" class="mean"/><text x="665" y="178" class="h">μθ(xₜ,t)</text><text x="665" y="205" class="small">분포의 중심</text><circle cx="735" cy="292" r="10" class="sample"/><line x1="735" y1="292" x2="735" y2="430" class="dash"/><text x="750" y="298" class="h">샘플 xₜ₋₁</text><text x="750" y="323" class="small">z ~ N(0,I)를 뽑아 선택된 한 점</text><circle cx="970" cy="90" r="11" class="xt"/><text x="990" y="96" class="h">주어진 현재 상태 xₜ</text><path d="M965 105 C910 165,840 206,780 240" class="arrow"/>
  <g transform="translate(95,555)"><rect width="1010" height="115" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="37" class="formula">pθ(xₜ₋₁ | xₜ) = N(xₜ₋₁ ; μθ(xₜ,t), Σθ(xₜ,t))</text><text x="25" y="73" class="formula">xₜ₋₁ = μθ(xₜ,t) + σₜz,   z ~ N(0,I)</text><text x="615" y="73" class="t">매 단계마다 분포를 만들고 그 안에서 한 점을 뽑는다.</text></g>
</svg>
