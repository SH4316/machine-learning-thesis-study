<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Why the target is p theta x0 not a single x0</title>
  <desc id="desc">A comparison between reconstructing one image x0 and learning a full distribution p theta of x0.</desc>
  <defs><style>.title{font:600 29px Arial,sans-serif;fill:#111827}.h{font:600 21px Arial,sans-serif;fill:#111827}.t{font:400 16px Arial,sans-serif;fill:#374151}.small{font:400 13px Arial,sans-serif;fill:#4b5563}.formula{font:400 20px "Times New Roman",serif;fill:#111827}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.bad{fill:#fef2f2;stroke:#ef4444;stroke-width:2}.good{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.axis{stroke:#6b7280;stroke-width:2}.curve{fill:none;stroke:#2563eb;stroke-width:5}.curve2{fill:none;stroke:#16a34a;stroke-width:5}.point{fill:#ea580c;stroke:#fff;stroke-width:3}.sample{fill:#7c3aed;stroke:#fff;stroke-width:2}.cross{stroke:#ef4444;stroke-width:5}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="55" y="58" class="title">왜 최종 목표가 x₀ 하나가 아니라 pθ(x₀)인가</text>
  <rect x="70" y="120" width="500" height="430" class="frame"/><rect x="95" y="150" width="450" height="82" rx="14" class="bad"/><text x="120" y="185" class="h">오해: 순수 생성 = 원본 x₀ 복원</text><text x="120" y="213" class="t">하지만 생성 시작점에는 원본 이미지가 없다.</text><line x1="145" y1="455" x2="485" y2="455" class="axis"/><line x1="145" y1="455" x2="145" y2="280" class="axis"/><circle cx="310" cy="350" r="12" class="point"/><text x="333" y="356" class="formula">x₀ 하나</text><line x1="270" y1="315" x2="355" y2="400" class="cross"/><line x1="355" y1="315" x2="270" y2="400" class="cross"/><text x="145" y="505" class="small">원본을 조건으로 주지 않으면 “그 원본”을 알 수 없다.</text>
  <rect x="630" y="120" width="500" height="430" class="frame"/><rect x="655" y="150" width="450" height="82" rx="14" class="good"/><text x="680" y="185" class="h">목표: 데이터와 같은 분포 pθ(x₀)</text><text x="680" y="213" class="t">생성 이미지는 이 분포에서 뽑힌 표본이다.</text><line x1="705" y1="455" x2="1045" y2="455" class="axis"/><line x1="705" y1="455" x2="705" y2="280" class="axis"/><path d="M710 452 C760 446,765 340,825 325 C878 312,895 438,930 438 C973 438,980 335,1040 318" class="curve"/><path d="M710 455 C760 448,770 352,830 337 C878 326,902 442,940 438 C982 434,990 354,1040 334" class="curve2" opacity=".45"/><circle cx="820" cy="331" r="7" class="sample"/><circle cx="916" cy="438" r="7" class="sample"/><circle cx="1018" cy="330" r="7" class="sample"/><text x="760" y="505" class="small">여러 샘플이 같은 데이터 법칙을 따른다.</text>
  <path d="M570 335 C590 335,607 335,625 335" class="arrow"/><text x="460" y="610" class="formula">pθ(x₀) = ∫ pθ(x₀:T) dx₁:T</text><text x="190" y="650" class="t">적분은 중간 경로 x₁:T를 모두 합쳐 “마지막 이미지가 어디에 나타나는가”를 정의한다.</text><text x="210" y="683" class="t">실행할 때는 적분값을 계산하지 않고, 역과정을 순서대로 샘플링해서 x̂₀ 하나를 얻는다.</text>
</svg>
