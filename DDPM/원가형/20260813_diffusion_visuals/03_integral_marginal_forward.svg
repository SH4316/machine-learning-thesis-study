<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Forward marginalization integral</title>
  <desc id="desc">A mixture visualization explaining q_t(x_t) as the integral over all original data points x0.</desc>
  <defs><style>.title{font:600 29px Arial,sans-serif;fill:#111827}.h{font:600 20px Arial,sans-serif;fill:#111827}.t{font:400 16px Arial,sans-serif;fill:#374151}.small{font:400 13px Arial,sans-serif;fill:#4b5563}.formula{font:400 20px "Times New Roman",serif;fill:#111827}.axis{stroke:#6b7280;stroke-width:2}.frame{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.component{fill:none;stroke:#94a3b8;stroke-width:3;stroke-dasharray:7 7}.sum{fill:none;stroke:#2563eb;stroke-width:5}.point{fill:#ea580c;stroke:#fff;stroke-width:2}.arrow{stroke:#374151;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="55" y="58" class="title">적분의 의미: 모든 가능한 원본 x₀가 현재 xₜ 분포에 기여한다</text>
  <rect x="70" y="120" width="470" height="390" class="frame"/><text x="100" y="160" class="h">왼쪽: 데이터 분포 q(x₀)</text><line x1="120" y1="440" x2="485" y2="440" class="axis"/><line x1="120" y1="440" x2="120" y2="210" class="axis"/><circle cx="190" cy="410" r="9" class="point"/><circle cx="220" cy="390" r="9" class="point"/><circle cx="250" cy="400" r="9" class="point"/><circle cx="365" cy="378" r="9" class="point"/><circle cx="395" cy="405" r="9" class="point"/><circle cx="430" cy="390" r="9" class="point"/><text x="160" y="468" class="small">원본 이미지 표본들</text><text x="98" y="232" class="small">확률밀도</text>
  <rect x="660" y="120" width="470" height="390" class="frame"/><text x="690" y="160" class="h">오른쪽: t단계 주변분포 qₜ(xₜ)</text><line x1="710" y1="440" x2="1075" y2="440" class="axis"/><line x1="710" y1="440" x2="710" y2="210" class="axis"/><path d="M720 438 C755 435,775 350,815 335 C855 350,875 435,910 438" class="component"/><path d="M780 438 C815 435,835 330,875 315 C915 330,935 435,970 438" class="component"/><path d="M870 438 C900 435,925 365,955 355 C990 365,1010 435,1065 438" class="component"/><path d="M720 435 C760 430,795 330,845 305 C900 277,940 345,980 365 C1015 383,1045 425,1070 435" class="sum"/><text x="725" y="468" class="small">회색 점선: 각 x₀에서 퍼진 q(xₜ | x₀)</text><text x="725" y="492" class="small">파란 실선: 이들을 가중합한 qₜ(xₜ)</text>
  <path d="M505 285 C575 230,610 230,680 285" class="arrow"/><path d="M505 370 C575 405,610 405,680 370" class="arrow"/><text x="548" y="262" class="formula">q(xₜ | x₀)</text><text x="546" y="430" class="t">각 원본을 중심으로 가우시안이 생김</text>
  <g transform="translate(95,560)"><rect width="1010" height="145" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="25" y="38" class="formula">qₜ(xₜ) = ∫ q(xₜ | x₀) q(x₀) dx₀</text><text x="25" y="75" class="t">적분은 “가능한 모든 원본 x₀에 대해, 그 원본이 xₜ를 만들 확률을 더한다”는 뜻이다.</text><text x="25" y="108" class="t">실제 학습에서는 이 적분을 직접 풀지 않고, 데이터셋에서 x₀를 뽑아 Monte Carlo 방식으로 평균을 근사한다.</text></g>
</svg>
